name: Quotes verification
on:
  pull_request:
    paths:
      - "app/(private)/quotes/**"
      - "app/lib/quote-calculations.ts"
      - "tests/quote-calculations.test.mjs"
      - ".github/workflows/quotes-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/quote-calculations.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
